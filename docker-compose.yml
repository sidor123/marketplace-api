x-app: &app
  image: ${APP_IMAGE:-marketplace-api:local}
  env_file: ${APP_ENV_FILE:-.env}
  init: true

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health/ready', timeout=6)"]
      interval: 10s
      timeout: 7s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
